on:
  push:
    branches:
      - master
      - main
  pull_request: {}

name: Test

permissions:
  contents: read

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          deps-file: deps.cirru
          caps-version: "0.1.1"

      - name: Validate Calcit source and contracts
        run: |
          set -euo pipefail
          caps --strict --ci
          caps verify --toolchain
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only --all-defs
          report="$(calcit calcit.cirru fix --workflow strict --verify --format json)"
          printf '%s\n' "$report"
          jq -e '.data.workflow.status? == "passed" and .diagnostics? == []' <<< "$report"
          calcit calcit.cirru analyze weak-types --summary-only --format json | jq -e '.data.summary.hits == 0'
          calcit calcit.cirru analyze weak-types --only coverage --coverage-level none,partial --summary-only --format json | jq -e '.data.summary.definitions == 0'
          calcit calcit.cirru analyze weak-types --only deprecated-call --summary-only --format json | jq -e '.data.summary.calls == 0'
          calcit calcit.cirru analyze weak-types --only dynamic-method --summary-only --format json | jq -e '.data.summary.findings == 0'

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check

      - run: cargo test --locked

      - run: cargo clippy --locked --all-targets -- -D warnings

      - run: ./build.sh

      - name: Verify C-safe exports only
        run: |
          exports="$(nm -D --defined-only target/release/libcalcit_std.so)"
          grep -q ' calcit_ffi_buffer_version$' <<<"$exports"
          grep -q ' calcit_ffi_buffer_free$' <<<"$exports"
          grep -q ' path_exists_calcit_ffi_v1$' <<<"$exports"
          ! grep -Eq ' (abi_version|edn_version|path_exists)$' <<<"$exports"

      - run: calcit calcit.cirru

      - name: Validate usage documentation
        run: |
          calcit calcit.cirru docs format-md README.md --check
          calcit calcit.cirru docs check-md README.md --failures-only
