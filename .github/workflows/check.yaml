on:
  push:
    branches:
      - master
      - main
  pull_request: {}

name: Test

permissions:
  contents: read

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: calcit-lang/setup-calcit@704b3f5cd6f9ce3bd1e0c926dbdd1d181adb8180 # v1
        with:
          tools: calcit,caps

      - run: caps verify --toolchain

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check

      - run: cargo test

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo build --release

      - run: calcit calcit.cirru edit format

      - run: git diff --exit-code -- calcit.cirru

      - name: Verify C-safe exports only
        run: |
          exports="$(nm -D --defined-only target/release/libcalcit_std.so)"
          grep -q ' calcit_ffi_buffer_version$' <<<"$exports"
          grep -q ' calcit_ffi_buffer_free$' <<<"$exports"
          grep -q ' path_exists_calcit_ffi_v1$' <<<"$exports"
          ! grep -Eq ' (abi_version|edn_version|path_exists)$' <<<"$exports"

      - run: mkdir -p dylibs/ && cp -v target/release/libcalcit_std.so dylibs/

      - run: caps --strict --ci

      - run: calcit calcit.cirru --check-only

      - run: calcit calcit.cirru analyze quality

      - run: calcit calcit.cirru analyze dynamic-methods --max 0

      - run: calcit calcit.cirru
