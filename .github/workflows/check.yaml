on:
  push:
    branches:
      - master
      - main
  pull_request: {}

name: Test

permissions:
  contents: read

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"

      - name: Validate Calcit source and contracts
        run: |
          caps --strict --ci
          caps verify --toolchain
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only
          calcit calcit.cirru analyze check-public --ns lib.core --ns lib.util --ns lib.test --summary-only --format json
          calcit calcit.cirru analyze quality --format json

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check

      - run: cargo test --locked

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo build --release

      - name: Verify C-safe exports only
        run: |
          exports="$(nm -D --defined-only target/release/libcalcit_std.so)"
          grep -q ' calcit_ffi_buffer_version$' <<<"$exports"
          grep -q ' calcit_ffi_buffer_free$' <<<"$exports"
          grep -q ' path_exists_calcit_ffi_v1$' <<<"$exports"
          ! grep -Eq ' (abi_version|edn_version|path_exists)$' <<<"$exports"

      - run: mkdir -p dylibs/ && cp -v target/release/libcalcit_std.so dylibs/

      - run: calcit calcit.cirru

      - name: Validate usage documentation
        run: |
          calcit calcit.cirru docs format-md README.md --check
          calcit calcit.cirru docs check-md README.md --failures-only
